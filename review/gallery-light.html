<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart gallery</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; background: #ffffff; color: #1f2328;
         font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  p  { margin: 0 0 24px; color: #57606a; }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
  .card { display: block; border: 1px solid #d0d7de; border-radius: 10px; background: #f6f8fa;
          padding: 10px 10px 6px; text-decoration: none; color: inherit; }
  .card:hover { border-color: #3d444d; }
  .name { margin: 0 0 8px; color: #57606a; font-size: 12px; letter-spacing: .04em; }
  img { display: block; width: 100%; height: auto; border-radius: 8px; }
  @media (max-width: 520px) { body { padding: 14px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>Chart gallery (light)</h1>
  <p>All 23 families, rendered from <code>scripts/samples.mjs</code>. Click a card for the full-size SVG.</p>

      <a class="card" href="../assets/light/pie.svg" target="_blank" rel="noreferrer">
        <div class="name">pie</div>
        <img src="../assets/light/pie.svg" alt="pie chart" loading="lazy">
      </a>
